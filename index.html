<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Falcon Store | متجر فالكون للشحن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Cairo', sans-serif;
            background: #0A1A0F;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* خلفية المتجر */
        .hero-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.postimg.cc/vmh0FNzj/1000245030.jpg');
            background-size: cover;
            background-position: center;
            z-index: 0;
            animation: slowZoom 20s ease-in-out infinite alternate;
        }
        
        .hero-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(5, 20, 8, 0.75) 0%, rgba(2, 12, 5, 0.85) 100%);
            z-index: 1;
        }
        
        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        /* البطاقة الرئيسية */
        .premium-card {
            position: relative;
            z-index: 15;
            max-width: 600px;
            width: 100%;
            background: rgba(8, 28, 14, 0.65);
            backdrop-filter: blur(20px);
            border-radius: 3rem;
            border: 1px solid rgba(80, 200, 100, 0.35);
            padding: 2rem 1.8rem 2.5rem;
            text-align: center;
            animation: cardRise 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
        }

        @keyframes cardRise {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .falcon-icon i {
            font-size: 3.5rem;
            color: #9BDF9B;
            text-shadow: 0 0 20px rgba(100, 200, 100, 0.5);
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .brand-name {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF 0%, #C8F0D0 50%, #8BCF8C 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0.5rem 0;
        }

        .tagline {
            color: rgba(210, 240, 180, 0.9);
            font-weight: 500;
            margin-bottom: 0.8rem;
        }

        .store-description {
            color: rgba(235, 250, 225, 0.9);
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 2rem;
            padding: 0.8rem;
            margin: 1rem 0;
        }

        /* الأزرار */
        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .premium-link {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            background: rgba(10, 35, 18, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(100, 180, 110, 0.3);
            padding: 1rem 1.6rem;
            border-radius: 2rem;
            text-decoration: none;
            font-weight: 550;
            transition: all 0.25s ease;
            cursor: pointer;
        }
        
        .premium-link i {
            font-size: 1.6rem;
            width: 2rem;
            text-align: center;
        }
        
        .premium-link span {
            flex: 1;
            text-align: right;
        }
        
        .premium-link:hover {
            transform: translateY(-4px);
            filter: brightness(1.05);
            box-shadow: 0 12px 25px -8px rgba(0, 0, 0, 0.4);
        }

        /* ألوان حسب المنصة */
        .link-whatsapp {
            background: rgba(37, 211, 102, 0.85);
            border-color: rgba(37, 211, 102, 0.9);
            color: white;
        }
        .link-whatsapp i { color: white; }
        .link-whatsapp:hover { background: #25D366; }

        .link-facebook {
            background: rgba(24, 119, 242, 0.85);
            border-color: rgba(24, 119, 242, 0.9);
            color: white;
        }
        .link-facebook i { color: white; }
        .link-facebook:hover { background: #1877F2; }

        .link-default {
            background: rgba(10, 35, 18, 0.7);
            border-color: rgba(100, 180, 110, 0.3);
            color: #F0FFF0;
        }
        .link-default i { color: #9BDF9B; }
        .link-default:hover { background: rgba(40, 85, 55, 0.85); }

        /* زر الصلاة على النبي */
        .prayer-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 100;
            background: linear-gradient(145deg, #0D2E1A, #071A0C);
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #FFD966;
            box-shadow: 0 0 20px rgba(255, 217, 102, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .prayer-btn:hover { transform: scale(1.08); }
        .prayer-btn i { font-size: 2rem; color: #FFD966; }

        .store-footer {
            margin-top: 1.8rem;
            font-size: 0.7rem;
            color: rgba(130, 180, 120, 0.6);
            border-top: 1px solid rgba(100, 180, 100, 0.2);
            padding-top: 1.2rem;
        }

        /* استجابة للجوال */
        @media (max-width: 550px) {
            .premium-card { padding: 1.5rem 1.2rem; margin: 1rem; }
            .brand-name { font-size: 1.7rem; }
            .prayer-btn { width: 55px; height: 55px; bottom: 15px; right: 15px; }
            .prayer-btn i { font-size: 1.5rem; }
            .premium-link { padding: 0.8rem 1.2rem; }
            .premium-link i { font-size: 1.4rem; }
        }

        /* أنيميشن دخول الأزرار */
        .premium-link {
            opacity: 0;
            transform: translateY(14px);
            animation: btnGlide 0.55s ease forwards;
        }
        @keyframes btnGlide {
            to { opacity: 1; transform: translateY(0); }
        }
        .premium-link:nth-child(1) { animation-delay: 0.1s; }
        .premium-link:nth-child(2) { animation-delay: 0.2s; }
        .premium-link:nth-child(3) { animation-delay: 0.3s; }
        .premium-link:nth-child(4) { animation-delay: 0.4s; }
        .premium-link:nth-child(5) { animation-delay: 0.5s; }
    </style>
</head>
<body>

<div class="hero-bg"></div>

<div class="premium-card">
    <div class="falcon-icon"><i class="fas fa-falcon"></i></div>
    <h1 class="brand-name">Falcon Store</h1>
    <div class="tagline">🦅 صقر السوق | أسرع شحن بأرخص سعر 🦅</div>
    <div class="store-description">
        <i class="fas fa-bolt"></i> شحن فوري | دعم 24 ساعة | ضمان كامل 💯<br>
        🎮 PUBG | Free Fire 💎 | Efootball | Roblox
    </div>
    
    <div class="links-grid" id="linksContainer"></div>
    <div class="store-footer"><i class="fas fa-shield-alt"></i> ضمان حق العميل | آراء العملاء في التعليقات</div>
</div>

<!-- زر الصلاة على النبي -->
<div class="prayer-btn" id="prayerButton">
    <i class="fas fa-play"></i>
</div>

<script>
    // ==========================================
    // 🦅 بيانات المتجر (عدل هنا بسهولة)
    // ==========================================
    const storeData = {
        name: "Falcon Store",
        links: [
            { title: "📱 قناة الواتساب", url: "https://whatsapp.com/channel/0029VbBCyDFF6smx9vNVG62A", type: "whatsapp" },
            { title: "💬 جروب Falcon Store (1)", url: "https://whatsapp.com/channel/0029VbBCyDFF6smx9vNVG62A", type: "whatsapp" },
            { title: "💬 جروب Falcon Store (2)", url: "https://whatsapp.com/channel/0029VbBCyDFF6smx9vNVG62A", type: "whatsapp" },
            { title: "✅ بوست الضمان وآراء العملاء", url: "https://www.facebook.com/share/p/12Frqq4qLdy/", type: "facebook" },
            { title: "📞 تواصل مباشر مع فالكون", url: "https://wa.me/20121816129", type: "whatsapp" }
        ]
    };

    // رابط صوت الصلاة على النبي (شغال 100%)
    const PRAYER_AUDIO_URL = "https://www.ashefaa.com/jawal/ranat/saly-3ala-mo7amad.mp3";

    // ==========================================
    // نظام الصوت
    // ==========================================
    let clickAudioContext = null;
    let prayerAudio = null;
    let isPrayerPlaying = false;
    const prayerBtn = document.getElementById('prayerButton');
    const prayerIcon = prayerBtn ? prayerBtn.querySelector('i') : null;

    // صوت "بيب" للأزرار العادية
    function playBeep() {
        try {
            if (!clickAudioContext) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                clickAudioContext = new AudioContext();
            }
            const oscillator = clickAudioContext.createOscillator();
            const gainNode = clickAudioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(clickAudioContext.destination);
            oscillator.frequency.value = 880;
            oscillator.type = 'sine';
            gainNode.gain.value = 0.15;
            oscillator.start();
            gainNode.gain.exponentialRampToValueAtTime(0.00001, clickAudioContext.currentTime + 0.15);
            oscillator.stop(clickAudioContext.currentTime + 0.15);
            clickAudioContext.resume();
        } catch(e) { console.log("Beep error:", e); }
    }

    // تحديث أيقونة زر الصلاة
    function updatePrayerIcon(playing) {
        if (prayerIcon) {
            if (playing) {
                prayerIcon.className = 'fas fa-pause';
            } else {
                prayerIcon.className = 'fas fa-play';
            }
        }
    }

    // تشغيل صوت الصلاة
    function playPrayerSound() {
        if (prayerAudio && isPrayerPlaying) {
            // إذا كان الصوت شغالاً، أوقفه
            prayerAudio.pause();
            prayerAudio.currentTime = 0;
            isPrayerPlaying = false;
            updatePrayerIcon(false);
        } else {
            // إذا كان الصوت متوقفاً، شغله
            if (prayerAudio) {
                prayerAudio.currentTime = 0;
                prayerAudio.play().catch(e => console.log("Prayer play error:", e));
            } else {
                prayerAudio = new Audio(PRAYER_AUDIO_URL);
                prayerAudio.volume = 0.9;
                prayerAudio.play().catch(e => console.log("Prayer load error:", e));
                
                // عند انتهاء الصوت تلقائياً
                prayerAudio.addEventListener('ended', () => {
                    isPrayerPlaying = false;
                    updatePrayerIcon(false);
                });
            }
            isPrayerPlaying = true;
            updatePrayerIcon(true);
        }
    }

    // ==========================================
    // عرض الأزرار
    // ==========================================
    function getButtonClass(type) {
        switch(type) {
            case 'whatsapp': return 'link-whatsapp';
            case 'facebook': return 'link-facebook';
            default: return 'link-default';
        }
    }

    function getButtonIcon(type) {
        switch(type) {
            case 'whatsapp': return 'fab fa-whatsapp';
            case 'facebook': return 'fab fa-facebook-f';
            default: return 'fas fa-link';
        }
    }

    function renderStore() {
        const container = document.getElementById('linksContainer');
        if(!container) return;
        container.innerHTML = '';
        
        storeData.links.forEach(link => {
            const a = document.createElement('a');
            a.className = `premium-link ${getButtonClass(link.type)}`;
            a.href = link.url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            
            // إضافة أيقونة
            const icon = document.createElement('i');
            icon.className = getButtonIcon(link.type);
            
            // إضافة النص
            const span = document.createElement('span');
            span.innerText = link.title;
            
            a.appendChild(icon);
            a.appendChild(span);
            
            // إضافة صوت البيب عند الضغط
            a.addEventListener('click', (e) => {
                playBeep();
            });
            
            container.appendChild(a);
        });
    }

    // ==========================================
    // بدء التشغيل
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
        renderStore();
        document.querySelector('.brand-name').innerText = storeData.name;
        
        // إعداد زر الصلاة
        if (prayerBtn) {
            prayerBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                playPrayerSound();
            });
        }
        
        // تفعيل الصوت بعد أول تفاعل من المستخدم (سياسة المتصفحات)
        const enableAudio = () => {
            if (clickAudioContext) {
                clickAudioContext.resume();
            }
            document.removeEventListener('click', enableAudio);
            document.removeEventListener('touchstart', enableAudio);
        };
        document.addEventListener('click', enableAudio);
        document.addEventListener('touchstart', enableAudio);
    });
</script>
</body>
</html>
